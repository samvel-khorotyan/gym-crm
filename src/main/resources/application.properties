server.port=8080

spring.application.name=gym-crm

spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyComponentPathImpl
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=3000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

spring.main.banner-mode=OFF
spring.mvc.format.date-time=iso

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.mapper.accept-case-insensitive-enums=true

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus

resilience4j.circuitbreaker.instances.trainerWorkloadService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.trainerWorkloadService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.trainerWorkloadService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.trainerWorkloadService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.trainerWorkloadService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.trainerWorkloadService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.trainerWorkloadService.failureRateThreshold=10
resilience4j.circuitbreaker.instances.trainerWorkloadService.eventConsumerBufferSize=10

resilience4j.retry.instances.trainerWorkloadService.max-attempts=3
resilience4j.retry.instances.trainerWorkloadService.wait-duration=1s
resilience4j.retry.instances.trainerWorkloadService.retry-exceptions=com.amazonaws.services.sqs.model.AmazonSQSException
resilience4j.retry.instances.trainerWorkloadService.ignore-exceptions=java.lang.IllegalArgumentException
resilience4j.retry.instances.trainerWorkloadService.enable-exponential-backoff=true
resilience4j.retry.instances.trainerWorkloadService.exponential-backoff-multiplier=2

eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.preferIpAddress=true

jwt.secret=your_secret_key_which_should_be_at_least_32_characters
jwt.expiration=86400000

spring.webflux.base-path=/api

spring.mvc.format.date=yyyy-MM-dd

gym.crm.cors.origins=http://localhost:8080/swagger-ui/index.html

cloud.aws.region.static=eu-north-1
aws.sqs.trainer-workload-queue=https://sqs.eu-north-1.amazonaws.com/309272221000/trainer-workload-queue
aws.sqs.trainer-workload-response-queue=https://sqs.eu-north-1.amazonaws.com/309272221000/trainer-workload-response-queue
aws.sqs.dead-letter-queue=https://sqs.eu-north-1.amazonaws.com/309272221000/dead-letter-queue

spring.redis.host=redis
spring.redis.port=6379

# AWS Credentials
cloud.aws.credentials.access-key=
cloud.aws.credentials.secret-key=
